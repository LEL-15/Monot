<div class="reveal-item score-card">
  <div class="score-header" style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px;">
    <div>
      <strong class="score-card-drawer">Player</strong>
      <div style="margin-top:4px;">was drawing <span class="pill score-card-word">Word</span></div>
    </div>
    <span>Drawing: </span>
    <span class="points-badge drawing-card-points">+0</span>
    <span>Guessing: </span>
    <span class="points-badge guessing-card-points">+0</span>
  </div>
  <img class="score-card-image" src="" alt="drawing" />
  <div class="score-card-guesses">
    <span class="hint">No guesses yet.</span>
  </div>
</div>
