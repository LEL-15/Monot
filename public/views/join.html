<div data-logo></div>
<div class="card">
    <h2>Join a game</h2>
    <form id="joinForm">
        <label for="name">Your name</label>
        <input type="text" id="name" maxlength="18" />
        <label for="gameCode">Game code</label>
        <input type="text" id="gameCode" autocomplete="off" />
        <button class="btn-primary" id="joinConfirm" type="submit">Join Game</button>
    </form>
    <button class="btn-ghost page-button" data-view="home">Back</button>
</div>
<div id="joinError"></div>
