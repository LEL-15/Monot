<h2>Lobby</h2>
<div class="card">
    <h3>Game code</h3>
    <div id="lobbyCode" class="code-display"></div>
</div>
<div class="card">
    <h3>Game Configuration</h3>
    <label for="rounds">Rounds</label>
    <div id="rounds"></div>
    <label for="roundSeconds">Draw time (sec)</label>
    <div id="roundSeconds"></div>
    <label for="catSeconds">Sort time (sec)</label>
    <div id="catSeconds"></div>
    <label for="difficulty">Difficulty</label>
    <div id="difficulty"></div>
</div>
<div class="card">
    <h3>Players (<span id="lobbyPlayerCount">0</span>)</h3>
    <ul id="lobbyPlayerList" class="player-list"><li>Waiting for players...</li></ul>
</div>
<div id="lobbyActions"></div>
