<h2>Lobby</h2>
<div class="card">
    <h3>Game code</h3>
    <div id="lobbyCode" class="code-display"></div>
</div>
<div class="card">
    <h3>Game Configuration</h3>
    <div id="lobbySettings">
        <form id="lobbySettingsForm" class="lobby-settings-form" data-initialized="false">
            <div class="row lobby-settings-row">
                <div><label for="lobbyRounds">Rounds</label><input type="number" id="lobbyRounds" min="1" max="10" /></div>
                <div><label for="lobbyRoundSeconds">Draw time (sec)</label><input type="number" id="lobbyRoundSeconds" min="5" max="180" /></div>
                <div><label for="lobbyCatSeconds">Sort time (sec)</label><input type="number" id="lobbyCatSeconds" min="10" max="120" /></div>
            </div>
            <label for="lobbyDifficulty">Word Pairing Difficulty</label>
            <select id="lobbyDifficulty">
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>
            <label class="lobby-checkbox"><input type="checkbox" id="lobbyHiddenWords" /> Hidden Words</label>
        </form>
    </div>
    <div id="lobbyError"></div>
</div>
<div class="card">
    <h3>Players (<span id="lobbyPlayerCount">0</span>)</h3>
    <ul id="lobbyPlayerList" class="player-list"><li>Waiting for players...</li></ul>
</div>
<div id="lobbyActions"></div>
<button class="btn-ghost" id="leaveBtn" type="button">Leave Game</button>
